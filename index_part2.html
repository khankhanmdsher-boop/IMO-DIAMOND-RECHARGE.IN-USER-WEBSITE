<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitleText">Khan Store - Yari Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #f59e0b; --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .header { background: #090d16; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
        .admin-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; }
        .section-badge { background: #334155; color: var(--primary-color); padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .control-form-group { margin-bottom: 15px; }
        .control-form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #94a3b8; }
        .control-form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; outline: none; }
        .action-chip { background: var(--primary-color); color: #000; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; cursor: pointer; border: none; font-weight: bold; display: inline-block; }
        .action-chip.view { background: #38bdf8; color: #000; }
        .action-chip.success { background: #10b981; color: #fff; }
        .action-chip.danger { background: #ef4444; color: #fff; }
        
        .diamond-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; max-height: 280px; overflow-y: auto; padding-right: 5px; }
        .diamond-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; }
        .diamond-card.selected { border: 2px solid var(--primary-color); background: rgba(245, 158, 11, 0.08); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 14px; width: 95%; max-width: 450px; border: 1px solid #475569; max-height: 95vh; overflow-y: auto; }
        
        .payment-apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
        .pay-app-btn { background: #0f172a; border: 1px solid #334155; padding: 8px 6px; border-radius: 8px; text-align: center; color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
        .pay-app-btn:hover { border-color: var(--primary-color); background: #1e293b; }
        .pay-app-btn img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; background: #fff; padding: 2px; }
        .navi-logo-box { width: 28px; height: 28px; background: #230939; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

        .glow-progress-container { display: none; margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .progress-bar-bg { width: 100%; background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981, #38bdf8); box-shadow: 0 0 10px #10b981; transition: width 0.3s ease; }
    </style>
</head>
<body onload="loadPortalSettings()">

<!-- Clean Header without Master Links -->
<div class="header">
    <div style="font-weight:bold; color:var(--primary-color);" id="headerStoreTitle"><i class="fa-solid fa-globe"></i> Khan Store - Yari Portal</div>
    <div style="font-size: 0.75rem; color: #94a3b8;"><i class="fa-solid fa-shield-check"></i> Secure Gateway</div>
</div>

<div class="container">
    <span class="section-badge" id="headerBannerBadge"><i class="fa-solid fa-gem"></i> LIVE YARI DIAMOND RECHARGE PORTAL (10 TO 10,000)</span>

    <div class="admin-card" style="background:#0f172a;">
        <div class="control-form-group">
            <label>Enter Imo Profile ID:</label>
            <input type="text" id="customerImoId" placeholder="Enter your Imo Profile ID">
        </div>

        <label style="font-size:0.85rem; color:#94a3b8; display:block; margin-bottom:8px;">Select Package:</label>
        <div class="diamond-grid" id="packagesContainer">
            <!-- Dynamically loaded packages -->
        </div>

        <button class="action-chip success" style="width:100%; padding:14px; text-align:center; font-size:1rem;" onclick="openCheckout()">Proceed to Checkout & Pay via UPI</button>
    </div>
</div>

<!-- Checkout & Payment Modal -->
<div class="modal-overlay" id="checkoutModal">
    <div class="modal-box" style="border:2px solid #10b981;">
        <h3 style="color:#10b981; margin-top:0; font-size:1.1rem;"><i class="fa-solid fa-shield-halved"></i> Secure Checkout & Payment</h3>
        <p style="font-size:0.80rem; color:#94a3b8; margin:0 0 10px 0;">Package: <strong id="chkPkg" style="color:#fff;"></strong> | Amt: <strong id="chkAmt" style="color:var(--primary-color);"></strong></p>
        
        <label style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px; font-weight:bold;">Pay Directly via UPI App:</label>
        <div class="payment-apps-grid">
            <a href="#" id="paytmLink" onclick="simulateAutoDetect()" class="pay-app-btn"><img src="https://cdn-icons-png.flaticon.com/512/825/825454.png" alt="Paytm">Paytm</a>
            <a href="#" id="gpayLink" onclick="simulateAutoDetect()" class="pay-app-btn"><img src="https://cdn-icons-png.flaticon.com/512/6124/6124998.png" alt="GPay">Google Pay</a>
            <a href="#" id="phonepeLink" onclick="simulateAutoDetect()" class="pay-app-btn"><img src="https://iconape.com/wp-content/png_logo_vector/phonepe-logo.png" alt="PhonePe">PhonePe</a>
            <a href="#" id="naviLink" onclick="simulateAutoDetect()" class="pay-app-btn">
                <div class="navi-logo-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 16V8C3 6.89543 3.89543 6 5 6H11V16H3Z" fill="#10B981"/>
                        <path d="M13 8V18C13 19.1046 13.8954 20 15 20H21V10H13V8Z" fill="#10B981"/>
                        <path d="M13 6H21V8H13V6Z" fill="#10B981"/>
                    </svg>
                </div>
                Navi UPI
            </a>
            <a href="#" id="bhimLink" onclick="simulateAutoDetect()" class="pay-app-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="BHIM">BHIM UPI</a>
            <a href="#" id="amazonLink" onclick="simulateAutoDetect()" class="pay-app-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Amazon_icon.svg" alt="Amazon">Amazon Pay</a>
        </div>

        <button class="action-chip view" style="width:100%; padding:10px; text-align:center; margin:10px 0; font-size:0.85rem;" onclick="toggleQrCode()"><i class="fa-solid fa-qrcode"></i> <span id="qrToggleBtnText">Show QR Code to Scan</span></button>

        <!-- QR Code Container without White Borders -->
        <div id="qrCodeContainer" style="display:none; background:#0f172a; padding:12px; border-radius:10px; text-align:center; margin-bottom:10px; border:2px solid var(--primary-color);">
            <img id="dynamicQRCode" src="" alt="UPI QR Code" style="width:150px; height:150px; display:block; margin:0 auto; border-radius:6px; background:#fff; padding:4px;">
            <span style="font-size:0.75rem; color:#f8fafc; font-weight:bold; margin-top:6px; display:block;"><i class="fa-solid fa-camera"></i> Scan with any UPI App</span>
            <div id="qrTimerDisplay" style="font-size:0.75rem; color:#ef4444; margin-top:4px; font-weight:bold;">QR Expires in: <span id="timerCountdown">05:00</span></div>
        </div>

        <div id="autoDetectBox" class="glow-progress-container">
            <div style="font-size:0.85rem; color:#38bdf8; font-weight:bold;" id="detectStatusText"><i class="fa-solid fa-spinner fa-spin"></i> Please wait, verifying your payment automatically...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;"><span id="progressPercent">0</span>% Completed</div>
        </div>

        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="action-chip danger" style="width:100%; padding:10px; text-align:center;" onclick="closeModal()">Cancel / Close</button>
        </div>
    </div>
</div>

<script>
let selectedPrice = 30;
let selectedName = "10 Diamonds";
let timerInterval = null;
let countdownSeconds = 300;

function loadPortalSettings() {
    let title = localStorage.getItem('apg_portal_title') || "Khan Store - Yari Portal";
    let banner = localStorage.getItem('apg_portal_banner') || "LIVE YARI DIAMOND RECHARGE PORTAL (10 TO 10,000)";
    let color = localStorage.getItem('apg_portal_color') || "#f59e0b";

    document.getElementById('pageTitleText').innerText = title;
    document.getElementById('headerStoreTitle').innerHTML = `<i class="fa-solid fa-globe"></i> ` + title;
    document.getElementById('headerBannerBadge').innerHTML = `<i class="fa-solid fa-gem"></i> ` + banner;
    document.documentElement.style.setProperty('--primary-color', color);

    loadPackages();
}

function loadPackages() {
    let defaultPkgs = [
        {name: "10 Diamonds", price: 30},
        {name: "50 Diamonds", price: 145},
        {name: "100 Diamonds", price: 285},
        {name: "500 Diamonds", price: 1390},
        {name: "1,000 Diamonds", price: 2750},
        {name: "10,000 Diamonds", price: 26500}
    ];
    let pkgs = localStorage.getItem('apg_yari_packages') ? JSON.parse(localStorage.getItem('apg_yari_packages')) : defaultPkgs;
    let container = document.getElementById('packagesContainer');
    container.innerHTML = "";

    pkgs.forEach((pkg, index) => {
        let isSel = index === 0 ? 'selected' : '';
        if(isSel) { selectedName = pkg.name; selectedPrice = pkg.price; }
        
        container.innerHTML += `
            <div class="diamond-card ${isSel}" onclick="selectPkg(this, '${pkg.name}', ${pkg.price})">
                <div style="font-weight:bold;">${pkg.name}</div>
                <div style="color:var(--primary-color); font-size:0.8rem;">₹${pkg.price.toLocaleString('en-IN')}</div>
            </div>
        `;
    });
}

function selectPkg(el, name, price) {
    document.querySelectorAll('.diamond-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedName = name;
    selectedPrice = price;
}

function openCheckout() {
    let imoId = document.getElementById('customerImoId').value;
    if(!imoId) { alert("Please enter your Imo Profile ID first!"); return; }
    
    document.getElementById('chkPkg').innerText = selectedName;
    document.getElementById('chkAmt').innerText = "₹" + selectedPrice.toLocaleString('en-IN');
    
    document.getElementById('qrCodeContainer').style.display = 'none';
    document.getElementById('autoDetectBox').style.display = 'none';
    document.getElementById('qrToggleBtnText').innerText = "Show QR Code to Scan";

    let masterUpiId = localStorage.getItem('apg_master_upi') || "merchant786khan@naviaxis";
    let upiUrl = `upi://pay?pa=${masterUpiId}&pn=Khan%20Store&am=${selectedPrice}&cu=INR`;
    let qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
    document.getElementById('dynamicQRCode').src = qrApiUrl;

    document.getElementById('paytmLink').href = `paytmmp://pay?pa=${masterUpiId}&pn=Store&am=${selectedPrice}&cu=INR`;
    document.getElementById('gpayLink').href = `tez://upi/pay?pa=${masterUpiId}&pn=Store&am=${selectedPrice}&cu=INR`;
    document.getElementById('phonepeLink').href = `phonepe://pay?pa=${masterUpiId}&pn=Store&am=${selectedPrice}&cu=INR`;
    document.getElementById('naviLink').href = upiUrl;
    document.getElementById('bhimLink').href = `bhim://pay?pa=${masterUpiId}&pn=Store&am=${selectedPrice}&cu=INR`;
    document.getElementById('amazonLink').href = `apac://pay?pa=${masterUpiId}&pn=Store&am=${selectedPrice}&cu=INR`;

    document.getElementById('checkoutModal').style.display = 'flex';
    startQrTimer();
}

function toggleQrCode() {
    let qrBox = document.getElementById('qrCodeContainer');
    let btnText = document.getElementById('qrToggleBtnText');
    if(qrBox.style.display === 'none') {
        qrBox.style.display = 'block';
        btnText.innerText = "Hide QR Code";
    } else {
        qrBox.style.display = 'none';
        btnText.innerText = "Show QR Code to Scan";
    }
}

function startQrTimer() {
    clearInterval(timerInterval);
    countdownSeconds = 300;
    let timerSpan = document.getElementById('timerCountdown');
    
    timerInterval = setInterval(() => {
        let mins = Math.floor(countdownSeconds / 60);
        let secs = countdownSeconds % 60;
        timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        
        if(countdownSeconds <= 0) {
            clearInterval(timerInterval);
            document.getElementById('qrCodeContainer').innerHTML = `<div style="color:#ef4444; font-weight:bold; padding:20px;">QR Code Expired! Please reopen checkout to generate a new QR code.</div>`;
        }
        countdownSeconds--;
    }, 1000);
}

function simulateAutoDetect() {
    document.getElementById('autoDetectBox').style.display = 'block';
    let fill = document.getElementById('progressBarFill');
    let pctText = document.getElementById('progressPercent');
    let statusText = document.getElementById('detectStatusText');
    
    let progress = 0;
    let interval = setInterval(() => {
        progress += 2;
        fill.style.width = progress + '%';
        pctText.innerText = progress;
        
        if(progress === 50) {
            statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Payment ping received, verifying UTR & Ref ID...`;
        }
        
        if(progress >= 100) {
            clearInterval(interval);
            statusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Payment Verified Successfully!`;
            
            let ordersList = localStorage.getItem('apg_yari_orders') ? JSON.parse(localStorage.getItem('apg_yari_orders')) : [];
            let newOrder = {
                orderId: "APG" + Math.floor(1000 + Math.random() * 9000),
                profileId: document.getElementById('customerImoId').value,
                package: selectedName,
                amount: "₹" + selectedPrice.toLocaleString('en-IN'),
                utr: "AUTO-" + Math.floor(100000000 + Math.random() * 900000000),
                status: "New"
            };
            ordersList.unshift(newOrder);
            localStorage.setItem('apg_yari_orders', JSON.stringify(ordersList));

            setTimeout(() => {
                document.getElementById('checkoutModal').style.display = 'none';
                alert("Payment auto-detected & order successfully submitted to Admin Dashboard!");
            }, 1200);
        }
    }, 50);
}

function closeModal() {
    clearInterval(timerInterval);
    document.getElementById('checkoutModal').style.display = 'none';
}
</script>
</body>
</html>
